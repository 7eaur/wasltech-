name: Full Site Reference QA

on:
  push:
    branches:
      - rebuild/home-reference-match-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static quality
        run: python3 scripts/site_quality_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/site-http.log
          exit 1

      - name: Capture and verify
        run: |
          mkdir -p full-site-audit
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const routes = [
            ['home','/'],
            ['services','/services.html'],
            ['service-web','/service-web.html?id=web'],
            ['service-app','/service-web.html?id=app'],
            ['service-store','/service-web.html?id=store'],
            ['service-programming','/service-web.html?id=programming'],
            ['service-tech','/service-web.html?id=tech'],
            ['service-design','/service-web.html?id=design'],
            ['service-profiles','/service-web.html?id=profiles'],
            ['service-marketing','/service-web.html?id=marketing'],
            ['portfolio','/portfolio.html'],
            ['about','/about.html'],
            ['process','/process.html'],
            ['contact','/contact.html'],
            ['faq','/faq.html'],
            ['blog','/blog.html'],
            ['404','/404.html']
          ];
          const viewports = [
            ['desktop',1440,900],
            ['mobile',390,844]
          ];

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report=[];

            for(const [name,path] of routes){
              for(const [mode,width,height] of viewports){
                const context=await browser.newContext({viewport:{width,height},colorScheme:'light',reducedMotion:'reduce'});
                const page=await context.newPage();
                const errors=[]; const failed=[];
                page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
                page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||'failed'}));
                const response=await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
                const metrics=await page.evaluate(()=>({
                  title:document.title,
                  h1Count:document.querySelectorAll('h1').length,
                  mainCount:document.querySelectorAll('main').length,
                  clientWidth:document.documentElement.clientWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  scrollHeight:document.documentElement.scrollHeight,
                  serviceCards:document.querySelectorAll('.ref-service-card,.site-image-card').length,
                  workCards:document.querySelectorAll('.ref-work-grid>a,.portfolio-project-card').length,
                  footerHeight:document.querySelector('footer')?.getBoundingClientRect().height||0
                }));
                await page.screenshot({path:`full-site-audit/${name}-${mode}.png`,fullPage:true,animations:'disabled'});
                report.push({
                  name,path,mode,width,height,status:response?.status()||null,
                  ...metrics,
                  horizontalOverflow:metrics.scrollWidth>metrics.clientWidth+1,
                  consoleErrors:errors,
                  failedRequests:failed
                });
                await context.close();
              }
            }

            // Narrow-phone regression pass without screenshots for every route.
            for(const [name,path] of routes){
              const context=await browser.newContext({viewport:{width:360,height:740},colorScheme:'light',reducedMotion:'reduce'});
              const page=await context.newPage();
              const errors=[]; const failed=[];
              page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
              page.on('requestfailed',r=>failed.push(r.url()));
              const response=await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
              const metrics=await page.evaluate(()=>({
                clientWidth:document.documentElement.clientWidth,
                scrollWidth:document.documentElement.scrollWidth
              }));
              report.push({
                name,path,mode:'mobile-360',status:response?.status()||null,
                horizontalOverflow:metrics.scrollWidth>metrics.clientWidth+1,
                consoleErrors:errors,failedRequests:failed
              });
              await context.close();
            }

            // Contact validation behavior.
            const contact=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
            const page=await contact.newPage();
            await page.goto('http://127.0.0.1:4173/contact.html',{waitUntil:'networkidle'});
            await page.locator('#contactForm button[type="submit"]').click();
            report.push({
              name:'contact-validation',
              invalidCount:await page.locator('#contactForm :invalid').count(),
              whatsappOpened:false
            });
            await contact.close();

            fs.writeFileSync('full-site-audit/report.json',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: wasltech-full-site-reference-audit
          path: full-site-audit/
          retention-days: 7
