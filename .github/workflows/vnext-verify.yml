name: VNext verify

on:
  push:
    branches:
      - rebuild/vnext-foundation-20260921
      - main
      - "seo/**"
      - "perf/**"
      - fix/independent-site-recovery-20261010
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/vnext-verify.yml"
      - "README.md"
      - "BRANCH_CLOSURE.md"

permissions:
  contents: read

concurrency:
  group: vnext-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and check VNext preview
        run: npm run vnext:verify

      - name: Build and check VNext release
        run: npm run vnext:verify:release

      - name: Verify final media sources
        run: node scripts/check-final-media.mjs

      - name: Keep analytics invisible to visitors
        run: node scripts/check-analytics-no-ui.mjs

      - name: Audit portfolio case-study evidence
        run: node scripts/audit-portfolio-evidence.mjs

      - name: Verify article to project editorial evidence links
        run: node scripts/check-article-project-links.mjs

      - name: Audit crawlable internal route discovery
        run: node scripts/audit-internal-discovery.mjs

      - name: Detect redirect-manifest drift
        run: node scripts/sync-legacy-redirects.mjs --check

      - name: Check legacy redirect routes
        run: node scripts/check-legacy-redirects.mjs

      - name: Upload foundation preview
        uses: actions/upload-artifact@v4
        with:
          name: wasltech-vnext-foundation
          path: dist/
          retention-days: 7

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: wasltech-vnext-release-candidate
          path: dist-release/
          retention-days: 7
