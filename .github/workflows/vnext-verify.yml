name: VNext verify

on:
  push:
    branches:
      - rebuild/vnext-foundation-20260921
      - main
      - "seo/**"
    paths-ignore:
      - "docs/qa/FINAL_AUDIT_CONTINUOUS_LOG.md"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "docs/core/**"
      - "PROJECT_STATUS.md"
      - "PROJECT_HANDOFF.md"
      - "AGENTS.md"

permissions:
  contents: read

concurrency:
  group: vnext-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and check VNext preview
        run: npm run vnext:verify

      - name: Build and check VNext release
        run: npm run vnext:verify:release

      - name: Upload foundation preview
        uses: actions/upload-artifact@v4
        with:
          name: wasltech-vnext-foundation
          path: dist/
          retention-days: 7

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: wasltech-vnext-release-candidate
          path: dist-release/
          retention-days: 7
