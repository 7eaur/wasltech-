name: Import uploaded baseline source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-baseline.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import parent snapshot from previous repository
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --no-checkout https://github.com/7eaur/wasl_tech.git "$tmp/source"
          git -C "$tmp/source" checkout 04cc4993eb1e773e5c38ba0b2c86768c3c34a3b3
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$tmp/source"/. .
          rm -rf .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -m "Import source snapshot 04cc499 for uploaded baseline"
          git branch -M main
          git push --force origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
