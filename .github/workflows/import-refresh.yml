name: Import Wasl Tech original baseline

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  import:
    if: github.event.issue.title == 'RUN_WASL_BASELINE_IMPORT'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import original source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone https://github.com/7eaur/wasl_tech.git "$tmp/source"
          git -C "$tmp/source" checkout 04cc4993eb1e773e5c38ba0b2c86768c3c34a3b3
          rm -rf "$tmp/source/.git"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmp/source"/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import original Wasl Tech baseline"
          git push --force origin main
