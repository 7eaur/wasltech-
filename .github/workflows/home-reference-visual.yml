name: Homepage Reference Visual QA

on:
  push:
    branches:
      - rebuild/home-reference-match-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static quality
        run: python3 scripts/site_quality_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ref-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ref-http.log
          exit 1

      - name: Capture
        run: |
          mkdir -p home-reference-audit
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[
              {name:'desktop-1440',width:1440,height:900},
              {name:'desktop-1366',width:1366,height:768},
              {name:'mobile-390',width:390,height:844},
              {name:'mobile-360',width:360,height:740}
            ];
            const report=[];
            for(const c of cases){
              const context=await browser.newContext({viewport:{width:c.width,height:c.height},colorScheme:'light',reducedMotion:'reduce'});
              const page=await context.newPage();
              const errors=[]; const failed=[];
              page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
              page.on('requestfailed',r=>failed.push(r.url()));
              const res=await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              const metrics=await page.evaluate(()=>({
                clientWidth:document.documentElement.clientWidth,
                scrollWidth:document.documentElement.scrollWidth,
                scrollHeight:document.documentElement.scrollHeight,
                h1:document.querySelector('h1')?.innerText||'',
                services:document.querySelectorAll('.ref-service-card').length,
                sections:document.querySelectorAll('main > section').length
              }));
              await page.screenshot({path:`home-reference-audit/${c.name}.png`,fullPage:true,animations:'disabled'});
              report.push({...c,status:res?.status(),...metrics,horizontalOverflow:metrics.scrollWidth>metrics.clientWidth+1,consoleErrors:errors,failedRequests:failed});
              await context.close();
            }
            fs.writeFileSync('home-reference-audit/report.json',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: wasltech-home-reference-audit
          path: home-reference-audit/
          retention-days: 7
