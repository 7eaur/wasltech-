name: Wasl Logo Motion Browser QA

on:
  push:
    branches:
      - design/wasl-logo-motion-preview-20261009

permissions:
  contents: read

jobs:
  chrome-animation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build review gallery
        run: npm run vnext:build

      - name: Serve gallery locally
        run: |
          cd dist
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/wasl-motion-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/__logo-motion/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wasl-motion-server.log
          exit 1

      - name: Install isolated QA browser
        working-directory: /tmp
        run: |
          mkdir -p wasl-logo-motion-qa
          cd wasl-logo-motion-qa
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Test 4 animations in real Chromium
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logo-motion-qa"
          cat > /tmp/wasl-logo-motion-qa/check.mjs <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const modes = ["voltsuite","luckypaint","fiverr","google"];
          let allPassed = true;
          try {
            for(const width of [390, 1366]){
              const context=await browser.newContext({viewport:{width,height:850},reducedMotion:"no-preference"});
              const page=await context.newPage();
              const errors=[];
              page.on("pageerror",e=>errors.push(String(e)));
              page.on("console",msg=>{if(msg.type()==="error")errors.push("console: "+msg.text())});
              await page.goto("http://127.0.0.1:4173/__logo-motion/",{waitUntil:"networkidle"});
              await page.waitForTimeout(300);
              const info=await page.evaluate(()=>{
                return {
                  cards:document.querySelectorAll(".grid .card").length,
                  active:document.querySelectorAll(".grid .stage.has-vector").length,
                  paths:[...document.querySelectorAll(".grid .stage")].map(x=>x.querySelectorAll("svg path[stroke]").length),
                  overflow:document.documentElement.scrollWidth>window.innerWidth+1,
                  svg:document.querySelector(".grid svg.animated-svg")?.getAttribute("viewBox")
                };
              });
              if(info.cards!==4||info.active!==4||info.paths.some(n=>n<15)||info.overflow){
                throw Error("bad gallery "+width+": "+JSON.stringify(info));
              }
              for(const mode of modes){
                const stage=page.locator('.grid .stage[data-mode="'+mode+'"]');
                await page.locator('[data-replay="'+mode+'"]').click();
                await page.waitForTimeout(250);
                const early=await stage.evaluate(node=>{
                  const svg=node.querySelector("svg");
                  const traces=[...svg.querySelectorAll('path[stroke]')];
                  const nonzero=traces.filter(p=>Number.parseFloat(p.style.strokeDashoffset)>0);
                  return {count:traces.length,nonzero:nonzero.length};
                });
                if(early.nonzero<5)throw Error("drawing does not animate "+mode+": "+JSON.stringify(early));
                await page.locator('[data-open="'+mode+'"]').click();
                await page.waitForTimeout(300);
                const simulated=await page.evaluate(()=>({
                  visible:!document.getElementById("preview-dialog").hidden,
                  animated:document.getElementById("demo-stage").classList.contains("has-vector"),
                  paths:document.querySelectorAll("#demo-stage svg path[stroke]").length
                }));
                if(!simulated.visible||!simulated.animated||simulated.paths<15)throw Error("demo failed "+mode+": "+JSON.stringify(simulated));
                await page.keyboard.press("Escape");
                if(!(await page.locator("#preview-dialog").evaluate(n=>n.hidden)))throw Error("Escape does not dismiss "+mode);
              }
              await page.screenshot({path:"logo-motion-qa/gallery-"+width+".png",fullPage:true,animations:"disabled"});
              if(errors.length)throw Error("browser errors "+width+": "+errors.join(" | "));
              console.log("PASS viewport",width,JSON.stringify(info));
              await context.close();
            }
          }catch(e){allPassed=false;console.error(String(e))}
          finally{await browser.close()}
          if(!allPassed)process.exit(1);
          EOF
          node /tmp/wasl-logo-motion-qa/check.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasl-logo-four-motion-screenshots
          path: logo-motion-qa/*.png
          retention-days: 7
